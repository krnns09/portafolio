    <g mask="url(#wear)" fill="#e6dcc0" stroke="#1a1918" stroke-width="3" stroke-linejoin="miter" paint-order="stroke">
      <path d="M0,100 L12,0 L44,0 L56,100 L40,100 L37,76 L19,76 L16,100 Z M21,62 L35,62 L31,16 L25,16 Z"/>
