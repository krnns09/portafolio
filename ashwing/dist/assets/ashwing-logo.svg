      <path transform="translate(300,0)" d="M0,0 L16,0 L40,62 L40,0 L56,0 L56,100 L40,100 L16,38 L16,100 L0,100 Z"/>
      <path transform="translate(364,0)" d="M8,0 L56,0 L56,16 L18,16 L18,84 L38,84 L38,62 L28,62 L28,48 L56,48 L56,92 L48,100 L8,100 L0,92 L0,8 Z"/>
    </g>
