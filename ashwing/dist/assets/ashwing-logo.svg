      <path transform="translate(64,0)" d="M8,0 L56,0 L56,16 L18,16 L18,42 L48,42 L56,50 L56,92 L48,100 L0,100 L0,84 L38,84 L38,58 L8,58 L0,50 L0,8 Z"/>
